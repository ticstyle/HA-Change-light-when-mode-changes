blueprint:
  name: Change light when mode changes
  description: >-
    ### Version 1.3.0

    Changes lights and optional switches upon day mode change, with a random delay of 5 to 31 seconds to spread out network traffic when using multiple instances.

    When the mode transitions to **Away**, entities are automatically turned off. Other modes adjust brightness and switch states based on your configured settings.

    #### Dependencies
    * Requires a sensor tracking day modes (e.g., `sensor.day_modes`) with states: `Away`, `Morning`, `Day`, `Evening`, `Night`.
    * A HACS integration for managing these modes can be found here: [Day Modes Integration](https://github.com/ticstyle/Day-Modes)

  domain: automation
  source_url: https://github.com/ticstyle/HA-Change-light-when-mode-changes/blob/main/change_light_when_mode_changes.yaml

  input:
    mode:
      name: Mode Entity
      description: Select the sensor tracking day modes or an input_select helper.
      default: sensor.day_modes
      selector:
        entity:
          domain:
            - input_select
            - sensor

    light_target:
      name: Light Target
      description: Select the target lights for this automation.
      default: {}
      selector:
        target:
          entity:
            - domain:
                - light

    control_switches:
      name: Enable Switch Control
      description: Enable to also control switches or outlets alongside your lights.
      default: false
      selector:
        boolean: {}

    switch_target:
      name: Switch Target
      description: Select the target switches to control.
      default: {}
      selector:
        target:
          entity:
            - domain:
                - switch

    # -----------------------
    # Morning Settings
    # -----------------------
    morning_section:
      name: Morning Settings
      icon: mdi:weather-sunset-up
      input:
        morning_toggle:
          name: Enable Morning Mode
          description: Control lights and switches when mode changes to Morning.
          default: true
          selector:
            boolean: {}

        morning_brightness:
          name: Morning Brightness
          description: Brightness percentage (0-100%).
          default: 10
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider

        morning_switch_on:
          name: Turn Switches ON in Morning
          default: true
          selector:
            boolean: {}

    # -----------------------
    # Day Settings
    # -----------------------
    day_section:
      name: Day Settings
      icon: mdi:weather-sunny
      input:
        day_toggle:
          name: Enable Day Mode
          description: Control lights and switches when mode changes to Day.
          default: true
          selector:
            boolean: {}

        day_brightness:
          name: Day Brightness
          description: Brightness percentage (0-100%).
          default: 75
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider

        day_switch_on:
          name: Turn Switches ON in Day
          default: true
          selector:
            boolean: {}

    # -----------------------
    # Evening Settings
    # -----------------------
    evening_section:
      name: Evening Settings
      icon: mdi:weather-sunset-down
      input:
        evening_toggle:
          name: Enable Evening Mode
          description: Control lights and switches when mode changes to Evening.
          default: true
          selector:
            boolean: {}

        evening_brightness:
          name: Evening Brightness
          description: Brightness percentage (0-100%).
          default: 35
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider

        evening_switch_on:
          name: Turn Switches ON in Evening
          default: true
          selector:
            boolean: {}

    # -----------------------
    # Night Settings
    # -----------------------
    night_section:
      name: Night Settings
      icon: mdi:weather-night
      input:
        night_toggle:
          name: Enable Night Mode
          description: Control lights and switches when mode changes to Night.
          default: true
          selector:
            boolean: {}

        night_brightness:
          name: Night Brightness
          description: Brightness percentage (0-100%).
          default: 0
          selector:
            number:
              min: 0.0
              max: 100.0
              step: 1.0
              mode: slider

        night_switch_on:
          name: Turn Switches ON in Night
          default: false
          selector:
            boolean: {}

    # -----------------------
    # Away Settings
    # -----------------------
    away_section:
      name: Away Settings
      icon: mdi:home-export-outline
      input:
        away_toggle:
          name: Enable Away Mode
          description: Control lights and switches when mode changes to Away.
          default: true
          selector:
            boolean: {}

        away_switch_on:
          name: Turn Switches ON in Away
          default: false
          selector:
            boolean: {}

trigger:
  - trigger: state
    entity_id: !input mode
    for:
      seconds: 5

mode: restart
max_exceeded: silent

condition: []

action:
  # Random delay to prevent network load spikes when multiple instances trigger simultaneously
  - delay:
      seconds: "{{ range(5, 31) | random }}"

  # Extract input configurations into local scope
  - variables:
      do_switches: !input control_switches
      sw_morning: !input morning_switch_on
      sw_day: !input day_switch_on
      sw_evening: !input evening_switch_on
      sw_night: !input night_switch_on
      sw_away: !input away_switch_on
      morning_enabled: !input morning_toggle
      day_enabled: !input day_toggle
      evening_enabled: !input evening_toggle
      night_enabled: !input night_toggle
      away_enabled: !input away_toggle

  - choose:
      # Morning Mode
      - conditions:
          - condition: state
            entity_id: !input mode
            state:
              - "Morning"
              - "morning"
        sequence:
          - condition: template
            value_template: "{{ morning_enabled }}"
          - action: light.turn_on
            enabled: !input morning_toggle
            data:
              brightness_pct: !input morning_brightness
            target: !input light_target
          - if:
              - condition: template
                value_template: "{{ do_switches }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ sw_morning }}"
                then:
                  - action: switch.turn_on
                    target: !input switch_target
                else:
                  - action: switch.turn_off
                    target: !input switch_target

      # Day Mode
      - conditions:
          - condition: state
            entity_id: !input mode
            state:
              - "Day"
              - "day"
        sequence:
          - condition: template
            value_template: "{{ day_enabled }}"
          - action: light.turn_on
            enabled: !input day_toggle
            data:
              brightness_pct: !input day_brightness
            target: !input light_target
          - if:
              - condition: template
                value_template: "{{ do_switches }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ sw_day }}"
                then:
                  - action: switch.turn_on
                    target: !input switch_target
                else:
                  - action: switch.turn_off
                    target: !input switch_target

      # Evening Mode
      - conditions:
          - condition: state
            entity_id: !input mode
            state:
              - "Evening"
              - "evening"
        sequence:
          - condition: template
            value_template: "{{ evening_enabled }}"
          - action: light.turn_on
            enabled: !input evening_toggle
            data:
              brightness_pct: !input evening_brightness
            target: !input light_target
          - if:
              - condition: template
                value_template: "{{ do_switches }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ sw_evening }}"
                then:
                  - action: switch.turn_on
                    target: !input switch_target
                else:
                  - action: switch.turn_off
                    target: !input switch_target

      # Night Mode
      - conditions:
          - condition: state
            entity_id: !input mode
            state:
              - "Night"
              - "night"
        sequence:
          - condition: template
            value_template: "{{ night_enabled }}"
          - action: light.turn_on
            enabled: !input night_toggle
            data:
              brightness_pct: !input night_brightness
            target: !input light_target
          - if:
              - condition: template
                value_template: "{{ do_switches }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ sw_night }}"
                then:
                  - action: switch.turn_on
                    target: !input switch_target
                else:
                  - action: switch.turn_off
                    target: !input switch_target

      # Away Mode
      - conditions:
          - condition: state
            entity_id: !input mode
            state:
              - "Away"
              - "away"
        sequence:
          - condition: template
            value_template: "{{ away_enabled }}"
          - action: light.turn_off
            target: !input light_target
            enabled: !input away_toggle
          - if:
              - condition: template
                value_template: "{{ do_switches }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ sw_away }}"
                then:
                  - action: switch.turn_on
                    target: !input switch_target
                else:
                  - action: switch.turn_off
                    target: !input switch_target
