---
extends: default

rules:
  # Allow long lines inside blueprint descriptions and markdown
  line-length: disable

  # Allow truthy values commonly used in Home Assistant
  truthy:
    allowed-values:
      - 'true'
      - 'false'
      - 'on'
      - 'off'
      - 'yes'
      - 'no'

  # Allow standard Home Assistant block sequence indentation
  indentation:
    spaces: 2
    indent-sequences: whatever

ignore: |
  .git/
