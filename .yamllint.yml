---
extends: default

rules:
  # Disable cosmetic rules
  document-start: disable
  line-length: disable
  comments: disable
  comments-indentation: disable
  trailing-spaces: disable
  empty-lines: disable
  truthy: disable
  brackets: disable

  # Allow flexible sequence indentation
  indentation:
    spaces: 2
    indent-sequences: whatever

ignore: |
  .git/
